name: Coverity Bridge CLI Scan 25.5

on:
  push:
    branches:
      - master

jobs:
  coverity:
    runs-on: ubuntu-latest

    env:
      BRIDGE_COVERITY_CONNECT_URL: ${{ secrets.BRIDGE_COVERITY_CONNECT_URL }}
      BRIDGE_COVERITY_CONNECT_USER_NAME: ${{ secrets.BRIDGE_COVERITY_CONNECT_USER_NAME }}
      BRIDGE_COVERITY_CONNECT_USER_PASSWORD: ${{ secrets.BRIDGE_COVERITY_CONNECT_USER_PASSWORD }}

      BRIDGE_NETWORK_SSL_TRUSTALL: "true"

      BRIDGE_COVERITY_LOCAL: "true"

      BRIDGE_COVERITY_BUILD_COMMAND: "mvn clean package -DskipTests"
      BRIDGE_COVERITY_CLEAN_COMMAND: "mvn clean"

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify Maven Build
        run: |
          mvn -version
          mvn clean package -DskipTests

      - name: Install Coverity Certificate
        env:
          COVERITY_CERT: ${{ secrets.COVERITY_CERT }}
        run: |
          echo "$COVERITY_CERT" > coverity.crt
          sudo cp coverity.crt /usr/local/share/ca-certificates/coverity.crt
          sudo update-ca-certificates || true

      - name: Download Bridge CLI
        run: |
          curl -fLsS -o bridge.zip "https://repo.blackduck.com/artifactory/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-linux64.zip"
          unzip -qo bridge.zip -d $RUNNER_TEMP

      - name: Run Coverity Scan
        run: |
          $RUNNER_TEMP/bridge-cli-bundle-linux64/bridge-cli \
            --stage connect \
            --diagnostics \
            coverity.connect.project.name="Demo 25.5" \
            coverity.connect.stream.name="Demo 25.3"
